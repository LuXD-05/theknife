# Local PostgreSQL for TheKnife backend.
# Start with:  docker compose up -d postgres
services:
  postgres:
    image: postgres:16
    container_name: theknife-postgres
    environment:
      POSTGRES_DB: theknife
      POSTGRES_USER: theknife
      POSTGRES_PASSWORD: theknife
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theknife -d theknife"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
