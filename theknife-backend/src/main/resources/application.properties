# TheKnife backend configuration

# --- HTTP ---
quarkus.http.port=8080

# --- Datasource (local PostgreSQL via docker-compose) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=theknife
quarkus.datasource.password=theknife
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/theknife

# --- Hibernate ORM: schema is owned by Flyway, Hibernate only validates it ---
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.jdbc.statement-batch-size=100

# --- Flyway: run migrations at startup ---
quarkus.flyway.migrate-at-start=true

# --- WebSockets Next: allow the large restaurant catalog payload ---
quarkus.websockets-next.server.max-message-size=67108864

# --- Data seed (runs once if tables are empty) ---
theknife.seed.enabled=true
theknife.data.dir=data
